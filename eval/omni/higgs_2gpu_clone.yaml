# Two-GPU voice-cloning profile for this evaluation, derived from the shipped
# higgs_multimodal_qwen3.yaml.
#
#   async_chunk: false   the shipped profiles stream codec chunks from Stage 0
#                        to Stage 1 and are documented "Plain TTS only (no
#                        voice cloning)". The whole evaluation is cloning, so
#                        streaming is off.
#   stage 0 replicas     Stage 0 is the autoregressive talker and dominates
#                        runtime, so it gets one replica per GPU. Stage 1 is
#                        the codec decoder with no KV cache; it stays on one
#                        card. This is data parallelism, not tensor
#                        parallelism -- a 4B model fits on a single 24GB card,
#                        so splitting it would only add communication.
# Higgs-audio v3 deploy: Stage 0 (talker) -> Stage 1 (code2wav) via shared memory.
#
# Auto-discovered default for model_type=higgs_multimodal_qwen3. This file is
# the high-throughput profile. Measured on 2x A5000 over 120 clips (876s of
# audio), against the shipped defaults this derives from:
#
#   shipped defaults (eager, sync sched)   55.8s   15.7x realtime
#   + stage 0 enforce_eager: false         52.2s   16.8x
#   + stage 0 async_scheduling: true       50.7s   17.3x   <- this file
#
# Both wins are small because the talker serialises on the CPU every decode
# step: higgs_audio_v3_talker.postprocess() is "called once per request in
# batch order" and _postprocess_impl() does event.synchronize() on the D2H
# staging copy, so the engine cannot run ahead. Per-card throughput therefore
# falls as GPUs are added (11.8x on one card, 8.4x/card on two), and these did
# NOT help: max_num_seqs 64 (69.0s -- the per-step O(batch) Python sits on the
# critical path), a third replica (51.5s, saturates one card to 95-100% but
# total is flat), one container per GPU (worse still). Going beyond this needs
# a library patch, not config.
#
# Stage 1 must stay enforce_eager: true -- higgs_audio_v3_code2wav.forward()
# ends in `.cpu()` on an unpinned tensor and reshapes by a data-dependent frame
# count, neither of which is capturable. It also draws only 3.2% SM, so there
# is nothing to win there.
#
# Plain TTS only (no voice cloning). async_chunk streams codec chunks from
# Stage 0 to Stage 1 as they are produced (TTFA approaches one AR loop's
# worth of work). Stage 1 honors meta.left_context_size + meta.right_holdback_size
# so the per-chunk codec windows stitch into a coherent PCM stream.
async_chunk: false
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # Stream PCM bytes back to the client as Stage 1 emits each chunk.
      codec_streaming: true
      # Streaming chunk shape for talker2code2wav_async_chunk:
      #   codec_chunk_frames        steady-state new frames per emit
      #   codec_left_context_frames sliding past context to avoid leading-edge artifacts
      #   codec_right_holdback_frames trailing frames held back so the codec
      #                              has future context for emit-region tail samples
      #   initial_codec_chunk_frames smaller first chunk to minimize TTFA
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      codec_right_holdback_frames: 4
      initial_codec_chunk_frames: 1
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 5000
      connector_get_max_wait: 500

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.6
    enforce_eager: false
    attention_backend: FLASHINFER
    # Eight codebooks share one attention row, so decode remains BF16 q_len=1
    # per request. vLLM's SM90 XQA capability gate does not benchmark this
    # shape; keep the faster native path (README_higgs_audio_v3.md, #5584).
    attention_config:
      use_trtllm_attention: false
    trust_remote_code: true
    # Stage-0 prefix caching is on by default. The talker's HS opt-out and
    # deferred ``codes.audio`` mm-output write (see higgs_audio_v3_talker.py)
    # keep per-step bookkeeping negligible; any shared text prefix across
    # concurrent requests is a net throughput win. Stage 1 (codec decoder)
    # has no KV cache and stays disabled.
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 8192
    devices: "0,1"
    num_replicas: 2
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 50
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0

platforms:
  rocm:
    stages:
      - stage_id: 0
        # FlashInfer is not supported on ROCm.
        attention_backend: TRITON_ATTN
